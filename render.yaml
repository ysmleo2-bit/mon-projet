services:
  - type: web
    name: rivia-setting
    runtime: docker
    plan: free
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COACH_EMAIL
        sync: false
      - key: COACH_PASSWORD
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
